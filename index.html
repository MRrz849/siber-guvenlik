<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Miraç'ın Güvenlik Sitesi</title>
<style>
  body {
    background-color: #121212;
    color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }
  .kutu {
    background: #1e1e1e;
    border: 2px solid #333;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
    max-width: 500px;
  }
  input, button {
    padding: 10px;
    margin-top: 5px;
    font-size: 16px;
  }
  input {
    width: 70%;
    background: #2a2a2a;
    color: white;
    border: 1px solid #444;
  }
  button {
    background: #0066cc;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover {
    background: #0052a3;
  }
  #sonuc {
    margin-top: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

  <h1>Siber Güvenlik Ödevim - 9/B</h1>
  <p>Bu siteyi şifre testi yapabilmek için kendim hazırladım.</p>

  <div class="kutu">
    <h3>Şifre Gücü Kontrolü</h3>
    <input type="text" id="sifreInput" placeholder="Şifreni yaz buraya...">
    <button onclick="kontrolEt()">Test Et</button>
    <div id="sonuc"></div>
  </div>

  <div class="kutu">
    <h3>Basit Şifre Üretici</h3>
    <button onclick="sifreUret()">Rastgele Şifre Yap</button>
    <p id="uretilen" style="font-family: monospace; color: #00ffcc;"></p>
  </div>

<script>
  // Şifre kontrol fonksiyonu
  function kontrolEt() {
    let sifre = document.getElementById("sifreInput").value;
    let sonucYazisi = document.getElementById("sonuc");

    if (sifre.length === 0) {
      sonucYazisi.innerHTML = "Lütfen boş bırakma!";
      sonucYazisi.style.color = "yellow";
      return;
    }

    // Basit mantık kurdum
    if (sifre.length < 6) {
      sonucYazisi.innerHTML = "Çok Zayıf! Hemen değiştir.";
      sonucYazisi.style.color = "red";
    } else if (sifre.length < 10) {
      sonucYazisi.innerHTML = "Orta seviye ama daha iyi olabilir.";
      sonucYazisi.style.color = "orange";
    } else {
      sonucYazisi.innerHTML = "Güçlü şifre, helal olsun!";
      sonucYazisi.style.color = "lightgreen";
    }
  }

  // Rastgele şifre üreteci (öğrenci işi basit mantık)
  function sifreUret() {
    let karakterler = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$";
    let sifrem = "";
    
    for (let i = 0; i < 10; i++) {
      let rastgele = Math.floor(Math.random() * karakterler.length);
      sifrem += karakterler[rastgele];
    }
    
    document.getElementById("uretilen").innerHTML = sifrem;
  }
</script>

</body>
</html>
